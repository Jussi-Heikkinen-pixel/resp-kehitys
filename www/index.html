<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EAF6EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Resp">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Resp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
/* =======================================================
   RESP — visuaalinen järjestelmä
   Pehmeä mintunvihreä ja kerma, valkoiset kortit,
   pyöreät vihreät toimintapainikkeet.
   ======================================================= */
:root{
  --green:#1C9B6A;
  --green-dark:#158057;
  --green-soft:#E6F5EE;
  --mint:#EAF6EF;
  --cream:#FDF4E9;
  --amber:#F0A742;
  --amber-soft:#FDF0DC;
  --red:#E35D4F;
  --red-soft:#FCEAE7;
  --ink:#16261F;
  --muted:#7A8A82;
  --line:#EBF0EC;
  --white:#FFFFFF;

  --r-xl:28px;
  --r-lg:22px;
  --r-md:16px;
  --shadow:0 8px 22px -10px rgba(22,38,31,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Nunito',system-ui,sans-serif;
  background:#CFE3D8; color:var(--ink);
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:34px 16px; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;}
input,select,textarea{font:inherit;color:inherit;}
::-webkit-scrollbar{display:none;}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

.app{
  width:392px; height:844px; position:relative; overflow:hidden;
  display:flex; flex-direction:column;
  border:9px solid #16261F; border-radius:46px;
  box-shadow:0 30px 70px -26px rgba(22,38,31,.55);
  background:linear-gradient(180deg,var(--mint) 0%, #F4F7F0 42%, var(--cream) 100%);
  font-size:16px;
}
.statusbar{display:flex;justify-content:space-between;padding:14px 26px 0;font-size:.76rem;font-weight:800;color:var(--muted);flex-shrink:0;}
.page{flex:1;overflow-y:auto;padding:4px 18px 128px;display:none;}
.page.on{display:block;}

/* ---------- yleiset ---------- */
h1{font-size:1.55rem;font-weight:900;letter-spacing:-.03em;}
h2{font-size:1.2rem;font-weight:900;}
h3{font-size:1rem;font-weight:800;}
.sub{font-size:.84rem;color:var(--muted);font-weight:700;}

.toprow{display:flex;align-items:center;gap:12px;padding:14px 0 2px;}
.toprow .mark{width:38px;height:38px;border-radius:50%;overflow:hidden;background:var(--green);flex-shrink:0;}
.toprow .mark img{width:100%;height:100%;object-fit:cover;display:block;}
.toprow .mid{flex:1;min-width:0;}
.toprow .mid p{font-size:.74rem;color:var(--muted);font-weight:800;}
.toprow .mid b{display:block;font-size:.98rem;font-weight:900;margin-top:1px;}
.toprow .bell{position:relative;width:40px;height:40px;border-radius:50%;background:var(--white);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);font-size:1rem;flex-shrink:0;}
.toprow .bell .badge{position:absolute;top:2px;right:2px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--white);}

/* ilmoitussivu */
.alert{display:flex;gap:12px;background:var(--white);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow);margin-bottom:10px;}
.alert .ic{width:40px;height:40px;border-radius:13px;background:var(--mint);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
.alert .tx{flex:1;min-width:0;}
.alert .tx b{display:block;font-size:.9rem;font-weight:800;line-height:1.4;}
.alert .tx span{font-size:.74rem;color:var(--muted);font-weight:700;}

.finder{display:flex;align-items:center;gap:10px;background:var(--white);border-radius:var(--r-md);padding:13px 15px;margin-top:14px;box-shadow:var(--shadow);}
.finder svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.4;stroke-linecap:round;}
.finder input{flex:1;border:none;outline:none;background:none;font-size:.92rem;font-weight:600;}
.finder .btn-sq{width:36px;height:36px;border-radius:12px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}

.banner{
  display:flex;align-items:center;gap:12px;background:var(--green-soft);
  border-radius:var(--r-lg);padding:16px;margin-top:14px;width:100%;text-align:left;
}
.banner .txt{flex:1;min-width:0;}
.banner .txt b{display:block;font-size:1.02rem;font-weight:900;line-height:1.25;}
.banner .txt p{font-size:.78rem;color:var(--muted);font-weight:700;margin-top:5px;}
.banner .pill{display:inline-flex;align-items:center;gap:6px;background:var(--green);color:#fff;font-size:.78rem;font-weight:800;padding:8px 14px;border-radius:99px;margin-top:11px;}
.banner .art{display:flex;flex-wrap:wrap;gap:4px;width:92px;flex-shrink:0;justify-content:center;}
.banner .art span{width:42px;height:42px;border-radius:12px;background:var(--white);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.banner .art img{width:80%;height:80%;object-fit:contain;}
.banner .art em{font-size:1.2rem;font-style:normal;}

.sect{display:flex;align-items:center;justify-content:space-between;margin:22px 0 11px;}
.sect h3{font-size:1.02rem;}
.sect .all{font-size:.82rem;font-weight:800;color:var(--green);}

/* kategorialaatat */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
.cats button{background:var(--white);border-radius:var(--r-md);padding:12px 4px 10px;box-shadow:var(--shadow);}
.cats .im{width:42px;height:42px;margin:0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.cats .im img{width:100%;height:100%;object-fit:contain;}
.cats .im em{font-size:1.5rem;font-style:normal;}
.cats .nm{font-size:.7rem;font-weight:800;margin-top:7px;}

/* tuotekortit */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.prow{display:flex;gap:11px;overflow-x:auto;padding:2px 0 6px;}
.prow .pcard{flex:0 0 132px;}
.pcard{background:var(--white);border-radius:var(--r-lg);padding:11px;box-shadow:var(--shadow);text-align:left;position:relative;}
.pcard .im{height:84px;border-radius:var(--r-md);background:var(--mint);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.pcard .im img{width:76%;height:76%;object-fit:contain;}
.pcard .im em{font-size:2.1rem;font-style:normal;}
.pcard h4{font-size:.9rem;font-weight:800;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pcard .qty{font-size:.74rem;color:var(--muted);font-weight:700;margin-top:2px;}
.pcard .foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:6px;}
.pcard .days{font-size:.76rem;font-weight:800;}
.pcard .days.ok{color:var(--green);}
.pcard .days.soon{color:var(--amber);}
.pcard .days.now{color:var(--red);}
.pcard .plus{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:800;flex-shrink:0;}

/* reseptikortit */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.rcard{background:var(--white);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);text-align:left;}
.rcard .im{height:96px;background:var(--mint);display:flex;align-items:center;justify-content:center;gap:4px;position:relative;}
.rcard .im img{height:62%;object-fit:contain;}
.catart{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;height:100%;}
.catart em{font-size:2.2rem;font-style:normal;line-height:1;}
.catname{font-size:.68rem;font-weight:800;color:var(--muted);letter-spacing:.03em;}
.bigcat{display:flex;flex-direction:column;align-items:center;gap:8px;}
.bigcat em{font-size:4rem;font-style:normal;line-height:1;}
.bigcat span{font-size:.86rem;font-weight:800;color:var(--muted);letter-spacing:.04em;}
.rcard .im em{font-size:1.8rem;font-style:normal;}
.rcard .save{position:absolute;top:8px;left:8px;background:var(--amber);color:#fff;font-size:.66rem;font-weight:900;padding:4px 9px;border-radius:99px;}
.rcard .bd{padding:12px 12px 14px;text-align:center;}
.rcard h4{font-size:.88rem;font-weight:800;line-height:1.3;min-height:2.4em;}
.rcard .meta{display:flex;gap:9px;justify-content:center;font-size:.72rem;color:var(--muted);font-weight:700;margin-top:6px;}

/* montako raaka-ainetta on jo kotona */
.have{margin-top:10px;}
.have .dots{display:flex;gap:3px;justify-content:center;}
.have .dots i{width:14px;height:5px;border-radius:99px;background:var(--line);display:block;}
.have .dots i.on{background:var(--green);}
.have .txt{font-size:.7rem;font-weight:800;color:var(--muted);margin-top:6px;display:block;}
.have.full .txt{color:var(--green);}
.have.full .dots i{background:var(--green);}

/* ---------- varasto ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin-top:12px;}
.chips button{flex-shrink:0;padding:10px 16px;border-radius:99px;font-size:.84rem;font-weight:800;background:var(--white);color:var(--muted);box-shadow:var(--shadow);}
.chips button[aria-pressed="true"]{background:var(--green);color:#fff;}
.chips .pip{display:inline-block;min-width:20px;padding:0 5px;margin-left:5px;border-radius:99px;background:var(--red);color:#fff;font-size:.72rem;font-weight:900;}
.chips button[aria-pressed="true"] .pip{background:rgba(255,255,255,.3);}

.scanrow{display:flex;align-items:center;gap:13px;background:var(--white);border-radius:var(--r-lg);padding:14px 15px;margin-top:13px;width:100%;text-align:left;box-shadow:var(--shadow);}
.scanrow .sc{width:44px;height:44px;border-radius:14px;background:var(--green-soft);display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex-shrink:0;}
.scanrow .st{flex:1;}
.scanrow .st b{display:block;font-size:.95rem;font-weight:900;}
.scanrow .st span{font-size:.76rem;color:var(--muted);font-weight:700;}
.scanrow .go{color:var(--green);font-size:1.2rem;}

.addbar{display:flex;gap:9px;align-items:center;background:var(--white);border-radius:var(--r-md);padding:6px 6px 6px 15px;margin-top:11px;box-shadow:var(--shadow);}
.addbar input{flex:1;border:none;outline:none;background:none;font-size:.92rem;font-weight:600;}
.addbar button{width:42px;height:42px;border-radius:13px;background:var(--green);color:#fff;font-size:1.3rem;font-weight:800;display:flex;align-items:center;justify-content:center;}

/* ---------- ehdotuslista ---------- */
.sugbox{display:none;background:var(--white);border-radius:var(--r-lg);box-shadow:var(--shadow);margin-top:8px;overflow:hidden;}
.sugbox.open{display:block;}
.sugbox button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 14px;text-align:left;border-bottom:2px solid var(--line);}
.sugbox button:last-child{border-bottom:none;}
.sugbox .im{width:34px;height:34px;border-radius:11px;background:var(--mint);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.sugbox .im img{width:80%;height:80%;object-fit:contain;}
.sugbox .im em{font-size:1rem;font-style:normal;}
.sugbox .nm{flex:1;font-size:.92rem;font-weight:800;}
.sugbox .gr{font-size:.72rem;color:var(--muted);font-weight:700;}

/* ---------- ostoslista ---------- */
.cartcard{display:flex;align-items:center;gap:12px;background:var(--white);border-radius:var(--r-lg);padding:12px;box-shadow:var(--shadow);margin-bottom:10px;}
.cartcard.done{opacity:.55;}
.tick{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--white);}
.tick.on{background:var(--green);border-color:var(--green);}
.tick svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;}
.cartcard .im{width:46px;height:46px;border-radius:13px;background:var(--mint);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.cartcard .im img{width:80%;height:80%;object-fit:contain;}
.cartcard .im em{font-size:1.2rem;font-style:normal;}
.cartcard .mid{flex:1;min-width:0;}
.cartcard .mid b{display:block;font-size:.95rem;font-weight:800;}
.cartcard.done .mid b{text-decoration:line-through;color:var(--muted);}
.cartcard .mid span{font-size:.72rem;color:var(--muted);font-weight:700;}
.cartcard .del{width:28px;color:var(--muted);font-size:1rem;flex-shrink:0;}

/* ---------- profiili ---------- */
.me{background:var(--white);border-radius:var(--r-xl);padding:22px;text-align:center;margin-top:14px;box-shadow:var(--shadow);}
.me .big{width:84px;height:84px;border-radius:50%;background:var(--green-soft);color:var(--green);font-size:2rem;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.me p{font-size:.84rem;color:var(--muted);font-weight:700;margin-top:4px;}
.medals{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:12px;}
.medal{background:var(--white);border-radius:var(--r-lg);padding:16px 10px;text-align:center;box-shadow:var(--shadow);}
.medal .em{font-size:1.5rem;}
.medal .n{font-size:1.2rem;font-weight:900;margin-top:5px;}
.medal .l{font-size:.72rem;color:var(--muted);font-weight:700;margin-top:2px;}
.rows{background:var(--white);border-radius:var(--r-lg);overflow:hidden;margin-top:12px;box-shadow:var(--shadow);}
.row{display:flex;align-items:center;gap:13px;padding:16px;border-bottom:2px solid var(--line);width:100%;text-align:left;}
.row:last-child{border-bottom:none;}
.row .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0;background:var(--mint);}
.row .tx{flex:1;font-size:.94rem;font-weight:800;}
.row .go{color:var(--muted);font-size:1.15rem;}

/* ---------- napit ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:16px;border-radius:99px;font-size:.98rem;font-weight:900;background:var(--green);color:#fff;box-shadow:0 6px 16px -8px rgba(28,155,106,.9);}
.btn:active{transform:translateY(2px);}
.btn.amber{background:var(--amber);}
.btn.red{background:var(--red);}
.btn.ghost{background:var(--white);color:var(--ink);box-shadow:var(--shadow);}
.btn + .btn{margin-top:10px;}
.btn .arrow{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:.9rem;}

.empty{background:var(--white);border-radius:var(--r-lg);padding:26px 20px;text-align:center;box-shadow:var(--shadow);}
.empty em{font-size:2rem;font-style:normal;}
.empty h3{margin-top:10px;}
.empty p{font-size:.84rem;color:var(--muted);font-weight:700;margin-top:6px;line-height:1.5;}

/* ---------- alapalkki, keskellä varasto ---------- */
.nav{
  position:absolute;left:14px;right:14px;bottom:14px;height:72px;
  background:var(--white);border-radius:26px;box-shadow:0 10px 26px -12px rgba(22,38,31,.35);
  display:flex;align-items:center;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom);
}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;width:58px;font-size:.66rem;font-weight:800;color:var(--muted);}
.nav svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;}
.nav button[aria-selected="true"]{color:var(--green);}
.nav button[aria-selected="true"] svg{stroke:var(--green);}
.nav .center{
  flex-direction:column;
  width:62px;height:62px;border-radius:50%;background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  margin-top:-34px;box-shadow:0 10px 22px -8px rgba(28,155,106,.9);border:5px solid var(--white);
  position:relative;
}
.nav .center svg{width:24px;height:24px;stroke:#fff;}
.nav .center[aria-selected="true"] svg{stroke:#fff;}
.nav .center .lbl{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:.62rem;font-weight:900;color:var(--green);white-space:nowrap;}
.nav .center .dot{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:99px;background:var(--amber);color:#fff;font-size:.62rem;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid var(--white);padding:0 4px;}

/* ---------- yksittäinen resepti ---------- */
.recipepage{padding:0 0 128px;}
.rhero{
  position:relative;height:230px;background:var(--mint);
  display:flex;align-items:center;justify-content:center;gap:10px;overflow:hidden;
}
.rhero .rshots{display:flex;align-items:center;gap:12px;}
.rhero .rshots img{height:112px;object-fit:contain;}
.rhero .rshots em{font-size:3.4rem;font-style:normal;}
.rback{
  position:fixed;top:24px;left:30px;width:40px;height:40px;border-radius:50%;
  background:var(--white);box-shadow:var(--shadow);font-size:1.4rem;font-weight:900;
  display:flex;align-items:center;justify-content:center;z-index:6;line-height:1;
}

.rbody{background:var(--white);border-radius:28px 28px 0 0;margin-top:-22px;position:relative;padding:22px 18px 10px;min-height:70vh;}
.rbody .rtop{display:flex;align-items:flex-start;gap:12px;}
.rbody h1{flex:1;font-size:1.3rem;line-height:1.25;}
.rbody .fav{width:40px;height:40px;border-radius:50%;background:var(--mint);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
.rbody .facts{display:flex;gap:9px;margin-top:12px;}
.rbody .fact{flex:1;background:var(--mint);border-radius:var(--r-md);padding:11px 8px;text-align:center;}
.rbody .fact b{display:block;font-size:.95rem;font-weight:900;}
.rbody .fact span{font-size:.7rem;color:var(--muted);font-weight:700;}
.ilist{margin-top:4px;}
.iline{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.iline:last-child{border-bottom:none;}
.iline .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex-shrink:0;}
.iline .dot.has{background:var(--green);}
.iline .nm{flex:1;font-size:.88rem;font-weight:700;}
.iline .amt{font-size:.8rem;color:var(--muted);font-weight:700;}
.iline.missing .nm{color:var(--muted);}

/* etusivun suunnitellut ruoat */
.planned{display:flex;align-items:center;gap:12px;background:var(--white);border-radius:var(--r-lg);padding:12px;box-shadow:var(--shadow);margin-bottom:10px;width:100%;text-align:left;}
.planned .im{width:52px;height:52px;border-radius:14px;background:var(--mint);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.planned .im img{width:80%;height:80%;object-fit:contain;}
.planned .im em{font-size:1.3rem;font-style:normal;}
.planned .mid{flex:1;min-width:0;}
.planned .mid b{display:block;font-size:.94rem;font-weight:800;}
.planned .mid span{font-size:.74rem;color:var(--muted);font-weight:700;}
.planned .go{color:var(--green);font-size:1.2rem;}
.planned .drop{width:30px;height:30px;border-radius:50%;background:var(--mint);color:var(--muted);font-size:.85rem;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.planned .badge{font-size:.68rem;font-weight:800;color:var(--amber);background:var(--amber-soft);padding:3px 8px;border-radius:99px;}

/* ---------- paneeli ---------- */
.veil{position:absolute;inset:0;background:rgba(22,38,31,.42);display:none;align-items:flex-end;z-index:60;}
.veil.open{display:flex;}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--white);border-radius:30px 30px 0 0;padding:16px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease;}
@keyframes up{from{transform:translateY(26px);}to{transform:translateY(0);}}
.grip{width:42px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 16px;}
.sheet h2{margin-bottom:6px;}
.sheet .note{font-size:.86rem;color:var(--muted);font-weight:700;line-height:1.5;}
.sheet .label{font-size:.8rem;font-weight:900;color:var(--muted);margin:18px 0 8px;}
.hero-pic{height:160px;border-radius:var(--r-lg);background:var(--mint);display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px;}
.hero-pic img{height:76%;object-fit:contain;}
.hero-pic em{font-size:3rem;font-style:normal;}

.ing{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:2px solid var(--line);}
.ing:last-of-type{border-bottom:none;}
.ing .thumb{width:40px;height:40px;border-radius:12px;background:var(--mint);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.ing .thumb img{width:80%;height:80%;object-fit:contain;}
.ing .thumb em{font-size:1.1rem;font-style:normal;}
.ing .nm{flex:1;font-size:.92rem;font-weight:800;}
.ing .st{font-size:.72rem;font-weight:800;color:var(--muted);}
.ing .st.has{color:var(--green);}

.steps{counter-reset:s;margin-top:4px;}
.steps li{counter-increment:s;display:flex;gap:12px;list-style:none;margin-bottom:13px;font-size:.92rem;line-height:1.55;font-weight:600;}
.steps li::before{content:counter(s);flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--green-soft);color:var(--green);font-weight:900;font-size:.84rem;display:flex;align-items:center;justify-content:center;}

.field{margin-bottom:12px;}
.field label{display:block;font-size:.8rem;font-weight:800;color:var(--muted);margin-bottom:7px;}
.field input,.field select{width:100%;background:var(--mint);border:2px solid transparent;border-radius:var(--r-md);padding:14px;font-size:.94rem;font-weight:700;outline:none;}
.field input:focus,.field select:focus{border-color:var(--green);}
.pair{display:flex;gap:10px;}
.pair .field{flex:1;}
.tip{display:flex;gap:10px;background:var(--amber-soft);border-radius:var(--r-md);padding:13px;font-size:.82rem;font-weight:700;line-height:1.5;margin-bottom:12px;}

/* ---------- kuittiskannaus ---------- */
.camview{position:relative;width:100%;aspect-ratio:3/4;max-height:50vh;background:#16261F;border-radius:var(--r-lg);overflow:hidden;}
.camview video{width:100%;height:100%;object-fit:cover;}
.camview .frame{position:absolute;inset:12% 10%;border:3px dashed rgba(255,255,255,.55);border-radius:var(--r-md);}
.camview .hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#fff;font-size:.8rem;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,.8);}
.shutterrow{display:flex;align-items:center;justify-content:space-between;margin-top:16px;}
.shutterrow .side{font-size:.86rem;font-weight:800;color:var(--muted);width:74px;text-align:center;}
.shutter{width:70px;height:70px;border-radius:50%;background:var(--green);border:5px solid var(--white);box-shadow:0 0 0 4px var(--green);}
.shutter:active{transform:scale(.94);}
.progress{background:var(--mint);border-radius:var(--r-lg);padding:24px 18px;text-align:center;margin-top:16px;}
.progress .pic{font-size:2rem;}
.progress .st{font-size:1rem;font-weight:900;margin-top:10px;}
.progress .sub{font-size:.84rem;color:var(--muted);font-weight:700;margin-top:4px;}
.track{height:10px;border-radius:99px;background:var(--line);margin-top:16px;overflow:hidden;}
.track i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .35s ease;}
.shopline{display:flex;align-items:center;gap:10px;background:var(--mint);border-radius:var(--r-md);padding:13px 14px;margin:14px 0 6px;font-size:.86rem;font-weight:900;}
.hit{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:2px solid var(--line);}
.hit:last-of-type{border-bottom:none;}
.hit.off{opacity:.4;}
.hit .thumb{width:40px;height:40px;border-radius:12px;background:var(--mint);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.hit .thumb img{width:80%;height:80%;object-fit:contain;}
.hit .thumb em{font-size:1.1rem;font-style:normal;}
.hit .nm{flex:1;min-width:0;border:none;background:none;font-size:.93rem;font-weight:800;outline:none;padding:4px 0;}
.hit .nm:focus{background:var(--mint);border-radius:8px;padding:4px 8px;}
.hit .pr{font-size:.86rem;font-weight:900;color:var(--muted);flex-shrink:0;}
.sum{display:flex;justify-content:space-between;font-size:.92rem;font-weight:900;padding-top:14px;margin-top:8px;border-top:3px solid var(--line);}

.toast{position:absolute;left:18px;right:18px;bottom:110px;background:var(--ink);color:#fff;border-radius:var(--r-md);padding:15px;text-align:center;font-size:.86rem;font-weight:800;z-index:80;opacity:0;transform:translateY(10px);transition:.22s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}

@media (max-width:560px),(pointer:coarse) and (max-width:900px){
  body{padding:0;background:var(--mint);align-items:stretch;min-height:100dvh;}
  .app{width:100%;height:100dvh;border:none;border-radius:0;box-shadow:none;padding-top:env(safe-area-inset-top);}
  .statusbar{display:none;}
}
.dev-tag{position:fixed;top:env(safe-area-inset-top,0px);left:50%;transform:translateX(-50%);z-index:9999;
  background:#E8A317;color:#3a2600;font:800 10px/1 Nunito,system-ui,sans-serif;padding:3px 10px 4px;border-radius:0 0 8px 8px;
  pointer-events:none;letter-spacing:.02em}
body:has(.dev-tag)::before{content:'';position:fixed;left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + 2px);background:#E8A317;z-index:9998;pointer-events:none}
</style>
</head>

    <div class="rgrid" id="homeRecipes"></div>
  </section>

  <section class="page" id="p-inventaario">

      <button aria-pressed="false" data-p="pakastin" onclick="pickPlace('pakastin')">Pakastin</button>
      <button aria-pressed="false" data-p="kaappi" onclick="pickPlace('kaappi')">Kaappi</button>

      <button onclick="quickAdd()" aria-label="Lisää tuote">+</button>
    </div>
    <div class="sugbox" id="sugStock"></div>

    <div id="shelf"></div>

    <div class="finder">

    </div>

      <span class="lbl">Varasto</span>

    <button data-v="ostoslista" aria-selected="false" onclick="go('ostoslista')">

    </button>
  </nav>

function pic(name){
  const n = String(name).toLowerCase().trim();
  let key = NAME2KEY[n] || ALIAS[n];
  if(!key){
    const hit = Object.keys(NAME2KEY).find(x => n.includes(x) || x.includes(n));
    if(hit) key = NAME2KEY[hit];
  }
  return (key && PHOTOS[key])
    ? '<img src="' + PHOTOS[key] + '" alt="">'
    : '<em>' + emojiFor(name) + '</em>';
}

const $ = id => document.getElementById(id);

function level(days){ return days <= 1 ? 'now' : (days <= 3 ? 'soon' : 'ok'); }
function daysText(days){
  if(days <= 0) return 'Tänään';
  if(days === 1) return 'Huomenna';
  if(days < 14) return days + ' päivää';
  if(days < 60) return Math.round(days/7) + ' viikkoa';
  return Math.round(days/30) + ' kuukautta';
}
function eur(v){ return (Math.round(v*100)/100).toFixed(2).replace('.',',') + ' €'; }
function kg(v){ return (Math.round(v*10)/10).toFixed(1).replace('.',',') + ' kg'; }
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

let alerts = [];
let alertsSeen = true;

function toast(msg, icon){
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__t);
  window.__t = setTimeout(() => t.classList.remove('show'), 2600);

  const d = new Date();
  alerts.unshift({text:msg, icon:icon || '🔔',
    time: d.getHours() + '.' + String(d.getMinutes()).padStart(2,'0')});
  if(alerts.length > 40) alerts.pop();
  alertsSeen = false;
  drawAlerts();
}
function drawAlerts(){
  const dot = $('alertDot');
  if(dot) dot.style.display = (!alertsSeen && alerts.length) ? 'block' : 'none';
  const list = $('alertList');
  if(!list) return;
  list.innerHTML = alerts.length
    ? alerts.map(a => '<div class="alert"><span class="ic">' + a.icon + '</span>' +
        '<span class="tx"><b>' + a.text + '</b><span>klo ' + a.time + '</span></span></div>').join('')
    : '<div class="empty"><em>🔔</em><h3>Ei ilmoituksia</h3>' +
      '<p>Sovelluksen viestit kerätään tähän, jotta voit palata niihin myöhemmin.</p></div>';
}
function openAlerts(){
  alertsSeen = true;
  drawAlerts();
  go('ilmoitukset');
}
function clearAlerts(){
  alerts = [];
  drawAlerts();
}
function sheet(html){ $('sheet').innerHTML = html; $('veil').classList.add('open'); }
function closeSheet(e){
  if(e && e.target !== e.currentTarget) return;
  $('veil').classList.remove('open');
}
function go(page){
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === 'p-' + page));
  const nav = page === 'resepti' ? 'reseptit' : page;
  document.querySelectorAll('.nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === nav ? 'true' : 'false'));
  const cur = document.querySelector('.page.on');
  if(cur) cur.scrollTop = 0;
}

/* varastosta etsitään tuote nimen perusteella */
function inStock(name){
  const key = String(name).toLowerCase().split(' ')[0];
  if(key.length < 3) return null;
  return stock.find(i => i.name.toLowerCase().includes(key) || key.includes(i.name.toLowerCase())) || null;
}
/* reseptin tilanne: mitä on kotona, mitä puuttuu */
function recipeState(r){
  const have = [], miss = [];
  r.uses.concat(r.extra || []).forEach(n => (inStock(n) ? have : miss).push(n));
  return {have, miss, total: r.uses.length + (r.extra || []).length};
}
/* montako vanhenevaa tuotetta resepti käyttää */
function rescues(r){
  return r.uses.filter(n => { const it = inStock(n); return it && it.days <= 3; }).length;
}
const GROUP_BY_NAME = {};
CATALOG.forEach(c => { GROUP_BY_NAME[c.n.toLowerCase()] = c.g; });

function guessGroup(name){
  const n = String(name).toLowerCase().trim();
  if(GROUP_BY_NAME[n]) return GROUP_BY_NAME[n];
  const hit = Object.keys(GROUP_BY_NAME).find(x => n.includes(x) || x.includes(n));
  if(hit) return GROUP_BY_NAME[hit];
  const rough = [
    [['maito','kerma','juusto','jogurt','voi','rahka'],'Maitotuotteet'],
    [['kana','liha','kala','lohi','makkara','pekoni'],'Liha ja kala'],
    [['leip','sämpyl','patonki'],'Leivät'],
    [['pakaste','jäätelö'],'Pakasteet'],
    [['omena','banaani','marja','hedelm'],'Hedelmät'],
    [['peruna','porkkan','tomaat','kurkku','sipul','salaat','kaali'],'Vihannekset'],
    [['jauho','sokeri','riisi','pasta','kaura'],'Kuivatuotteet'],
    [['mauste','kastike','öljy','säilyke','pippuri','suola'],'Säilykkeet ja mausteet'],
    [['mehu','juoma','kahvi','tee'],'Juomat'],
  ];
  for(const [keys, g] of rough){ if(keys.some(k => n.includes(k))) return g; }
  return 'Muut';
}
function defaultPlace(group){
  if(group === 'Pakasteet') return 'pakastin';
  if(['Maitotuotteet','Liha ja kala','Vihannekset'].includes(group)) return 'jääkaappi';
  return 'kaappi';
}
function valueOf(it){ return PRICE[it.group] || 2.00; }
function weightOf(it){ return WEIGHT[it.group] || 0.3; }

          '<button class="drop" onclick="unplan(\'' + r.id + '\')" aria-label="Poista suunnitelmasta">✕</button>' +
        '</div>';
      }).join('')
    : '<div class="empty"><em>🧾</em><h3>Ei suunniteltuja ruokia</h3>' +
      '<p>Kun lisäät reseptin puuttuvat raaka-aineet ostoslistalle, resepti jää tähän odottamaan.</p></div>';

  /* suositut reseptit */
  const popular = recipes.slice().sort((a,b) => recipeState(b).have.length - recipeState(a).have.length).slice(0,4);
  $('homeRecipes').innerHTML = popular.map(recipeCard).join('');
}

function unplan(id){
  const r = recipes.find(x => x.id === id);
  planned = planned.filter(x => x !== id);
  drawHome();
  toast((r ? r.name : 'Resepti') + ' poistettiin suunnitelmasta', '🧾');
}

/* haku etusivulta vie oikeaan osioon */
function homeSearch(){
  const q = ($('homeQ').value || '').trim();
  if(q.length < 2) return;
  $('recipeQ').value = q;
  pickMeal('kaikki');
  drawRecipes();

}
function openCategory(key){
  if(key === 'valipala'){

/* ---------- 4. VARASTO ---------- */
let place = 'kaikki';
let groupFilter = null;
let snackOnly = false;
/* välipalaksi sopivat: hedelmät, maitotuotteet ja pienet naposteltavat */
const SNACK_WORDS = ['patukka','keksi','pähkinä','jogurtti','rahka','välipala','banaani','omena','appelsiini','mandariini','marja','juusto','kananmuna','näkkileipä','hedelm'];
function isSnack(i){
  const n = i.name.toLowerCase();
  return i.group === 'Hedelmät' || SNACK_WORDS.some(w => n.includes(w));
}

function itemCard(i){
  return '<button class="pcard" onclick="openItem(\'' + i.id + '\')">' +
    '<span class="im">' + pic(i.name) + '</span>' +
    '<h4>' + i.name + '</h4>' +
    '<p class="qty">' + i.qty + '</p>' +
    '<span class="foot"><span class="days ' + level(i.days) + '">' + daysText(i.days) + '</span>' +
    '<span class="plus">›</span></span></button>';
}
let expiringOnly = false;

function showExpiring(){
  place = 'kaikki'; groupFilter = null; snackOnly = false; expiringOnly = true;
  document.querySelectorAll('#placeChips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === 'vanhenevat' ? 'true' : 'false'));
  drawStock();
}
function pickPlace(p){
  place = p;
  groupFilter = null;
  snackOnly = false;
  expiringOnly = false;
  document.querySelectorAll('#placeChips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === p ? 'true' : 'false'));
  drawStock();
}
function drawStock(){
  let list = stock.filter(i => place === 'kaikki' || i.place === place);
  if(groupFilter) list = list.filter(i => i.group === groupFilter);
  if(snackOnly) list = list.filter(isSnack);
  if(expiringOnly) list = list.filter(i => i.days <= 3);
  list.sort((a,b) => a.days - b.days);

  if(!list.length){
    const msg = expiringOnly
      ? ['Mikään ei ole vanhenemassa', 'Hienoa! Varastossa ei ole lähipäivinä vanhenevia tuotteita.']
      : (snackOnly
        ? ['Ei välipaloja varastossa', 'Lisää hedelmiä tai muita naposteltavia, niin ne näkyvät tässä.']
        : ['Täällä ei ole mitään', 'Skannaa kuitti tai lisää tuote käsin.']);
    $('shelf').innerHTML = '<div class="empty" style="margin-top:16px"><em>🧺</em><h3>' + msg[0] + '</h3><p>' + msg[1] + '</p></div>';
    return;
  }
  const pip = $('expPip');
  if(pip) pip.textContent = stock.filter(i => i.days <= 3).length;

  let html = '';
  if(expiringOnly){
    html += '<div class="sect"><h3>Käytä lähipäivinä</h3>' +
      '<button class="all" onclick="pickPlace(\'kaikki\')">Näytä kaikki</button></div>' +
      '<div class="pgrid">' + list.map(itemCard).join('') + '</div>';
    $('shelf').innerHTML = html;
    return;
  }
  if(snackOnly){
    html += '<div class="sect"><h3>Välipalaksi sopivat</h3>' +
      '<button class="all" onclick="pickPlace(\'kaikki\')">Näytä kaikki</button></div>' +
      '<div class="pgrid">' + list.map(itemCard).join('') + '</div>';
    $('shelf').innerHTML = html;
    return;
  }
  if(groupFilter){
    html += '<div class="sect"><h3>' + groupFilter + '</h3>' +
      '<button class="all" onclick="pickPlace(\'kaikki\')">Näytä kaikki</button></div>' +
      '<div class="pgrid">' + list.map(itemCard).join('') + '</div>';
  } else {
    const groups = {};
    list.forEach(i => (groups[i.group] = groups[i.group] || []).push(i));
    Object.keys(groups).forEach(g => {
      html += '<div class="sect"><h3>' + g + '</h3><span class="all">' + groups[g].length + ' kpl</span></div>' +
        '<div class="pgrid">' + groups[g].map(itemCard).join('') + '</div>';
    });
  }
  $('shelf').innerHTML = html;
}
function quickAdd(){
  const box = $('newItem'), v = box.value.trim();
  if(!v) return;
  const name = tidyName(v);
  const group = guessGroup(name);
  stock.push({id:'i' + Date.now(), name, qty:'1 kpl', group, place:defaultPlace(group), days:SHELF[group] || 14});
  box.value = '';
  hideSuggest('sugStock');
  drawStock(); drawHome(); drawRecipes();
  toast(name + ' lisättiin varastoon', '🧺');
}

/* tuotteen tiedot ja muokkaus */
function openItem(id){
  const i = stock.find(x => x.id === id);
  if(!i) return;
  window.__orig = {place:i.place, days:i.days, group:i.group};
  sheet('<div class="grip"></div>' +
    '<div class="hero-pic" style="background:var(--canvas)">' + pic(i.name) + '</div>' +
    '<h2>' + i.name + '</h2>' +
    '<p class="note">' + i.group + ' · ' + i.place.charAt(0).toUpperCase() + i.place.slice(1) + ' · ' + daysText(i.days) + ' jäljellä</p>' +
    '<p class="label">Muokkaa tietoja</p>' +
    '<div class="field"><label for="fName">Nimi</label><input id="fName" value="' + esc(i.name) + '"></div>' +
    '<div class="pair">' +
      '<div class="field"><label for="fQty">Määrä</label><input id="fQty" value="' + esc(i.qty) + '"></div>' +
      '<div class="field"><label for="fDays">Päiviä jäljellä</label><input id="fDays" type="number" inputmode="numeric" value="' + i.days + '"></div>' +

      '<div class="field"><label for="fGroup">Ryhmä</label><select id="fGroup" onchange="placeChanged()">' +

      '</select></div>' +
      '<div class="field"><label for="fPlace">Paikka</label><select id="fPlace" onchange="placeChanged()">' +
        ['jääkaappi','pakastin','kaappi'].map(p => '<option value="' + p + '" ' + (p === i.place ? 'selected' : '') + '>' + p.charAt(0).toUpperCase() + p.slice(1) + '</option>').join('') +
      '</select></div>' +
    '</div>' +
    '<div id="placeTip"></div>' +
    '<button class="btn" onclick="saveItem(\'' + i.id + '\')">Tallenna</button>' +
    '<button class="btn ghost" onclick="useItem(\'' + i.id + '\')">Käytin tämän</button>' +
    '<button class="btn red" onclick="tossItem(\'' + i.id + '\')">Heitin pois</button>');
}
/* pakastimeen siirto pidentää säilyvyyttä, sulatus lyhentää sen */
function placeChanged(){
  const to = $('fPlace').value, g = $('fGroup').value, o = window.__orig, tip = $('placeTip');
  if(to === 'pakastin' && o.place !== 'pakastin'){
    const d = FREEZER[g] || 180;
    $('fDays').value = d;
    tip.innerHTML = '<div class="tip"><span>❄️</span><span>Pakastimessa tämä säilyy noin ' + Math.round(d/30) + ' kuukautta. Muutimme päivät puolestasi.</span></div>';
  } else if(o.place === 'pakastin' && to !== 'pakastin'){
    const d = THAW[g] || 3;
    $('fDays').value = d;
    tip.innerHTML = '<div class="tip"><span>💧</span><span>Sulatettu ruoka kannattaa käyttää ' + d + ' päivän sisällä.</span></div>';
  } else {
    $('fDays').value = o.days;
    tip.innerHTML = '';
  }
}
function saveItem(id){
  const i = stock.find(x => x.id === id);
  const name = $('fName').value.trim();
  if(!name){ toast('Anna tuotteelle nimi'); return; }
  i.name = name;
  i.qty = $('fQty').value.trim() || '1 kpl';
  i.days = parseInt($('fDays').value) || 0;
  i.group = $('fGroup').value;
  i.place = $('fPlace').value;
  closeSheet(); drawStock(); drawHome(); drawRecipes();
  toast(name + ' päivitettiin');
}
function useItem(id){
  const i = stock.find(x => x.id === id);
  const nm = i.name, w = weightOf(i), v = valueOf(i);
  stock = stock.filter(x => x.id !== id);
  savedKg += w; savedEur += v;
  closeSheet(); drawStock(); drawHome(); drawRecipes(); drawProfile();
  toast(nm + ' käytetty · pelastit ' + kg(w) + ' ja ' + eur(v));
}
function tossItem(id){
  const i = stock.find(x => x.id === id);
  const nm = i.name, v = valueOf(i);
  stock = stock.filter(x => x.id !== id);
  savedEur = Math.max(0, savedEur - v);
  closeSheet(); drawStock(); drawHome(); drawRecipes(); drawProfile();
  toast(nm + ' kirjattiin hävikiksi · −' + eur(v));
}

/* ---------- 5. RESEPTIT ---------- */
let mealFilter = 'kaikki';

/* reseptien kuvitus tulee kategoriasta, ei raaka-aineista */
const CAT_LOOK = {
  aamu:     {key:'aamupala', nimi:'Aamupala', em:'🥣', bg:'#FFF3DC'},
  valipala: {key:'valipala', nimi:'Välipala', em:'🍎', bg:'#FDECEC'},
  herkut:   {key:'valipala', nimi:'Välipala', em:'🍰', bg:'#FDECEC'},
  juomat:   {key:'valipala', nimi:'Juoma',    em:'🥤', bg:'#E8F1FA'},
  lounas:   {key:'ateriat',  nimi:'Ateria',   em:'🍽️', bg:'#E7F4EC'},
  leivonta: {key:'leivonta', nimi:'Leivonta', em:'🧁', bg:'#F4EDFB'},
};
function look(r){ return CAT_LOOK[r.cat] || CAT_LOOK.lounas; }

function recipeCard(r){
  const n = rescues(r);
  const st = recipeState(r);
  const L = look(r);
  const shots = '<span class="catart" style="background:' + L.bg + '"><em>' + L.em + '</em>' +
    '<span class="catname">' + L.nimi + '</span></span>';
  return '<button class="rcard" onclick="openRecipe(\'' + r.id + '\')">' +
    '<span class="im" style="background:' + L.bg + '">' + shots +
      (n ? '<span class="save">Pelastaa ' + n + '</span>' : '') +
      (r.own ? '<span class="save" style="background:var(--green);left:auto;right:8px">OMA</span>' : '') + '</span>' +
    '<span class="bd"><h4>' + r.name + '</h4>' +
    '<span class="meta"><span>' + r.mins + ' min</span><span>' + r.serves + ' annosta</span></span>' +
    '<span class="have' + (st.miss.length ? '' : ' full') + '">' +
      '<span class="dots">' +
        Array.from({length: st.total}, (_, k) => '<i class="' + (k < st.have.length ? 'on' : '') + '"></i>').join('') +
      '</span>' +
      '<span class="txt">' + (st.miss.length
        ? st.have.length + '/' + st.total + ' raaka-ainetta kotona'
        : 'Kaikki raaka-aineet kotona') + '</span>' +
    '</span></span></button>';
}
function pickMeal(m){
  mealFilter = m;
  document.querySelectorAll('#mealChips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m ? 'true' : 'false'));
  drawRecipes();
}
function drawRecipes(){
  const q = ($('recipeQ').value || '').trim().toLowerCase();
  const match = r => !q || (r.name + ' ' + r.uses.join(' ') + ' ' + (r.extra || []).join(' ')).toLowerCase().includes(q);
  let html = '';

  if(mealFilter === 'kaikki' && !q){
    /* ensin nostot vanhenevista, sitten kaikki muut */
    const saving = recipes.filter(r => rescues(r) > 0)
                          .sort((a,b) => rescues(b) - rescues(a)).slice(0,4);
    const ids = saving.map(r => r.id);
    const rest = recipes.filter(r => !ids.includes(r.id));
    if(saving.length){
      html += '<div class="sect" style="margin-top:4px"><h3>Pelasta vanhenevat</h3>' +
        '<button class="all" onclick="pickMeal(\'vanheneva\')">Näytä kaikki</button></div>' +
        '<div class="rgrid">' + saving.map(recipeCard).join('') + '</div>';
    }
    html += '<div class="sect"><h3>Kaikki reseptit</h3><span class="all">' + rest.length + ' kpl</span></div>' +
      '<div class="rgrid">' + rest.map(recipeCard).join('') + '</div>';
    $('recipeGrid').innerHTML = html;
    $('recipeGrid').className = '';
    return;
  }

  let list = recipes.filter(match);
  if(mealFilter === 'vanheneva') list = list.filter(r => rescues(r) > 0);
  else if(mealFilter === 'omat') list = list.filter(r => r.own);
  else if(mealFilter !== 'kaikki') list = list.filter(r => r.cat === mealFilter);

  $('recipeGrid').className = 'rgrid';
  if(!list.length){
    let msg = 'Kokeile toista hakusanaa tai valitse toinen kategoria.';
    if(mealFilter === 'omat' && !q) msg = 'Tee ensimmäinen oma reseptisi plus-painikkeesta.';
    if(mealFilter === 'vanheneva' && !q) msg = 'Mikään varastossa ei ole juuri nyt vanhenemassa.';
    $('recipeGrid').innerHTML = '<div class="empty" style="grid-column:1/-1"><em>🔍</em><h3>Ei reseptejä</h3><p>' + msg + '</p></div>';
    return;
  }
  $('recipeGrid').innerHTML = list.map(recipeCard).join('');
}

let openRecipeId = null;

function openRecipe(id){
  const r = recipes.find(x => x.id === id);
  if(!r) return;
  openRecipeId = id;
  const st = recipeState(r);
  const all = r.uses.concat(r.extra || []);

  const L = look(r);
  $('rShots').innerHTML = '<span class="bigcat"><em>' + L.em + '</em><span>' + L.nimi + '</span></span>';
  $('rHero').style.background = L.bg;

  $('rBody').innerHTML =
    '<div class="rtop"><h1>' + r.name + '</h1>' +
    '<button class="fav" onclick="toggleFav(\'' + r.id + '\')">' + (r.fav ? '❤️' : '🤍') + '</button></div>' +
    '<div class="facts">' +
      '<div class="fact"><b>' + r.mins + ' min</b><span>valmistusaika</span></div>' +
      '<div class="fact"><b>' + r.serves + '</b><span>annosta</span></div>' +
      '<div class="fact"><b>' + st.have.length + '/' + st.total + '</b><span>kotona</span></div>' +
    '</div>' +
    '<p class="label">Raaka-aineet</p>' +
    '<div class="ilist">' + all.map(function(n){
      const has = !!inStock(n);
      const amt = (r.amounts && r.amounts[n]) || '';
      return '<div class="iline ' + (has ? '' : 'missing') + '">' +
        '<span class="dot ' + (has ? 'has' : '') + '"></span>' +
        '<span class="nm">' + n + '</span>' +
        '<span class="amt">' + amt + '</span></div>';
    }).join('') + '</div>' +
    '<p class="label">Näin se tehdään</p>' +
    '<ol class="steps">' + r.steps.map(x => '<li>' + x + '</li>').join('') + '</ol>' +
    (st.miss.length
      ? '<button class="btn amber" onclick="missingToCart(\'' + r.id + '\')">Lisää ' + st.miss.length + ' puuttuvaa ostoslistalle</button>'
      : '<div class="tip" style="background:var(--green-soft)"><span>✅</span><span>Kaikki raaka-aineet löytyvät kotoa.</span></div>') +
    '<button class="btn" onclick="cookRecipe(\'' + r.id + '\')">Tein tämän ruoan</button>' +
    (r.own ? '<button class="btn ghost" onclick="openRecipeEditor(\'' + r.id + '\')">Muokkaa reseptiä</button>' : '');

  go('resepti');
  $('p-resepti').scrollTop = 0;
}
function backFromRecipe(){ go('reseptit'); }
function toggleFav(id){
  const r = recipes.find(x => x.id === id);
  r.fav = !r.fav;
  openRecipe(id);
  toast(r.fav ? 'Tallennettu suosikkeihin' : 'Poistettu suosikeista');
}

function missingToCart(id){
  const r = recipes.find(x => x.id === id);
  let added = 0;
  recipeState(r).miss.forEach(n => {
    if(!cart.find(c => c.name.toLowerCase() === n.toLowerCase())){
      cart.push({id:'c' + Date.now() + Math.random().toString(16).slice(2), name:n, from:r.name, done:false});
      added++;
    }
  });
  if(!planned.includes(r.id)) planned.push(r.id);
  drawCart(); drawHome();
  if(openRecipeId) openRecipe(openRecipeId);
  toast(added ? added + ' tuotetta lisättiin ostoslistalle' : 'Kaikki puuttuvat ovat jo listalla', '🛒');
}
function cookRecipe(id){
  const r = recipes.find(x => x.id === id);
  let used = 0, savedW = 0, savedV = 0;
  r.uses.forEach(n => {
    const it = inStock(n);
    if(it){
      if(it.days <= 3){ savedW += weightOf(it); savedV += valueOf(it); }
      stock = stock.filter(x => x.id !== it.id);
      used++;
    }
  });
  savedKg += savedW; savedEur += savedV;
  /* ruoka on tehty: poistetaan sen rivit ostoslistalta eikä lisätä uusia */
  cart = cart.filter(c => c.from !== r.name);
  planned = planned.filter(x => x !== r.id);
  closeSheet(); drawStock(); drawRecipes(); drawCart(); drawHome(); drawProfile();
  go('reseptit');
  toast(used + ' raaka-ainetta käytettiin varastosta', '🍽️');
}

/* ---------- 5b. OMA RESEPTI ---------- */

function plainName(raw){
  let t = ' ' + raw.toLowerCase()
    .replace(/\d+([.,]\d+)?\s*(kg|g|ml|cl|dl|l|kpl|pkt|ps|rs|prk|tlk)\b/g, ' ')
    .replace(/\d+([.,]\d+)?/g, ' ')
    .replace(/[^a-zåäö\s-]/g, ' ')
    .replace(/\s+/g, ' ') + ' ';
  for(const [keys, nm] of BASE_NAMES){ if(keys.some(k => t.includes(k))) return nm; }
  const words = t.trim().split(' ').filter(w => w.length > 2 && !BRANDS.includes(w) && !FILLERS.includes(w));
  if(!words.length) return raw.trim();
  const w = words[words.length - 1];
  return w.charAt(0).toUpperCase() + w.slice(1);
}

/* kuvan esikäsittely parantaa tunnistusta selvästi */
function prepImage(src){
  return new Promise(function(resolve){
    const img = new Image();
    img.onload = function(){
      const scale = Math.min(1, 1400 / img.width);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const d = ctx.getImageData(0, 0, c.width, c.height), px = d.data;
      for(let i = 0; i < px.length; i += 4){
        let v = 0.299*px[i] + 0.587*px[i+1] + 0.114*px[i+2];
        v = (v - 128) * 1.6 + 128;
        px[i] = px[i+1] = px[i+2] = v < 0 ? 0 : (v > 255 ? 255 : v);
      }
      ctx.putImageData(d, 0, 0);
      resolve(c.toDataURL('image/png'));
    };
    img.onerror = function(){ resolve(src); };
    img.src = src;
  });
}

function parseReceipt(text){
  const lines = text.split('\n').map(l => l.replace(/\s+/g,' ').trim()).filter(l => l.length > 2);
  const items = [];
  let dropped = 0;
  lines.forEach(function(line){
    const low = line.toLowerCase();
    const m = line.match(/(\d{1,3}[.,]\d{2})\s*(e|eur|€|\*|a)?\s*$/i);
    if(!m){ dropped++; return; }
    let raw = line.slice(0, m.index)
      .replace(/^\d{5,}\s*/, '')
      .replace(/\s*\d+\s*[xX]\s*\d+[.,]\d{2}\s*$/, '')
      .replace(/[|_]+/g, ' ').replace(/\s{2,}/g, ' ').trim();
    const price = m[1].replace('.', ',');
    if(raw.length < 3 || !/[a-zåäö]{3}/i.test(raw)){ dropped++; return; }
    if(SKIP_WORDS.some(w => low.includes(w))){ dropped++; return; }
    if(parseFloat(price.replace(',','.')) > 150){ dropped++; return; }
    const name = plainName(raw);
    if(items.some(x => x.name === name)){ dropped++; return; }
    const group = guessGroup(name);
    items.push({key:'k' + items.length, name, price, group, place:defaultPlace(group), days:SHELF[group] || 14, keep:true});
  });
  const shop = SHOPS.find(sh => text.toLowerCase().includes(sh.toLowerCase())) || 'Tunnistettu kuitti';
  const dm = text.match(/(\d{1,2}[.\-/]\d{1,2}[.\-/]\d{2,4})/);
  return {items, dropped, shop, date: dm ? dm[1] : ''};
}

}

async function readReceipt(src){
  scanStep('🔍', 'Valmistellaan kuvaa', 'Parannetaan kontrastia tunnistusta varten', 12);

  if(typeof Tesseract === 'undefined'){
    setTimeout(function(){
      scanItems = DEMO_LINES.map(function(l, i){
        const name = plainName(l[0]), group = guessGroup(name);
        return {key:'k' + i, name, price:l[1], group, place:defaultPlace(group), days:SHELF[group] || 14, keep:true};
      });
      scanShop = 'K-Market (esimerkki)'; scanDate = ''; scanSkipped = 0;
      reviewScan('Tekstintunnistusta ei saatu ladattua. Näytämme esimerkkikuitin, jotta näet miten toiminto toimii.');
    }, 700);
    return;
  }

  try{
    let img = src;
    if(src instanceof Blob){
      img = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(src); });
    }
    img = await prepImage(img);
    const out = await Tesseract.recognize(img, 'fin+eng', {logger: function(m){
      if(m.status === 'recognizing text') scanStep('🧾','Luetaan tekstiä','Tunnistetaan rivit kuvasta', 20 + Math.round(m.progress * 70));
      else if(m.status && m.status.includes('load')) scanStep('⬇️','Ladataan tunnistinta','Ensimmäinen kerta kestää pidempään', 15);
    }});
    scanStep('📦', 'Päätellään säilyvyys', 'Arvioidaan paikka ja parasta ennen', 96);
    const parsed = parseReceipt(out.data.text || '');
    scanItems = parsed.items; scanShop = parsed.shop; scanDate = parsed.date; scanSkipped = parsed.dropped;
    if(!scanItems.length) reviewScan('Kuitista ei löytynyt tuoterivejä. Kuvaa kuitti suoraan ylhäältä hyvässä valossa ja yritä uudelleen.');
    else setTimeout(() => reviewScan(), 250);
  }catch(err){
    reviewScan('Tunnistus keskeytyi. Voit lisätä tuotteet käsin varastosivulta.');
  }
}

function reviewScan(trouble){
  const keep = scanItems.filter(i => i.keep);
  const total = keep.reduce((s, i) => s + (parseFloat(String(i.price).replace(',','.')) || 0), 0);
  let html = '<div class="grip"></div><h2>Tarkista tuotteet</h2>' +
    '<p class="note">Korjaa nimiä tarvittaessa ja jätä pois rivit, joita et halua varastoon.</p>' +
    (trouble ? '<div class="tip" style="background:var(--red-soft); margin-top:12px">⚠️ <span>' + trouble + '</span></div>' : '') +
    '<div class="shopline"><span>🧾</span><span>' + scanShop + (scanDate ? ', ' + scanDate : '') + '</span></div>';

  if(!scanItems.length){
    html += '<button class="btn" onclick="closeSheet(); go(\'inventaario\')">Lisää tuotteet käsin</button>' +
            '<button class="btn ghost" onclick="closeSheet()">Sulje</button>';
    sheet(html); return;
  }

  html += scanItems.map(function(i){
    return '<div class="hit ' + (i.keep ? '' : 'off') + '">' +
      '<button class="tick ' + (i.keep ? 'on' : '') + '" onclick="toggleHit(\'' + i.key + '\')" aria-label="Valitse">' +
        (i.keep ? '<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-9"/></svg>' : '') + '</button>' +
      '<span class="thumb">' + pic(i.name) + '</span>' +
      '<input class="nm" value="' + esc(i.name) + '" onchange="renameHit(\'' + i.key + '\', this.value)">' +
      '<span class="pr">' + i.price + ' €</span></div>';
  }).join('');

  html += '<div class="sum"><span>' + keep.length + ' valittu</span><span>' + total.toFixed(2).replace('.',',') + ' €</span></div>' +
    (scanSkipped ? '<p class="note" style="margin-top:8px">' + scanSkipped + ' riviä ohitettiin, kuten pantit ja summat.</p>' : '') +
    '<button class="btn" onclick="saveScan()">Lisää valitut varastoon</button>' +
    '<button class="btn ghost" onclick="closeSheet()">Peruuta</button>';
  sheet(html);
}
function toggleHit(key){ const i = scanItems.find(x => x.key === key); i.keep = !i.keep; reviewScan(); }
function renameHit(key, val){
  const i = scanItems.find(x => x.key === key);

  i.place = defaultPlace(i.group);

  reviewScan();
}

/* ehdotukset kirjoittaessa, sovelluksen omalla ulkoasulla */
function suggest(inputId, boxId){
  const input = $(inputId), box = $(boxId);
  if(!input || !box) return;
  const q = input.value.trim().toLowerCase();
  if(q.length < 1){ box.classList.remove('open'); box.innerHTML = ''; return; }
  const hits = CATALOG
    .filter(c => c.n.toLowerCase().startsWith(q))
    .concat(CATALOG.filter(c => !c.n.toLowerCase().startsWith(q) && c.n.toLowerCase().includes(q)))
    .slice(0, 6);
  if(!hits.length){ box.classList.remove('open'); box.innerHTML = ''; return; }
  box.innerHTML = hits.map(c =>
    '<button onclick="useSuggestion(\'' + inputId + '\',\'' + boxId + '\',\'' + c.n.replace(/'/g,"\\'") + '\')">' +
      '<span class="im">' + pic(c.n) + '</span>' +
      '<span class="nm">' + c.n + '</span>' +
      '<span class="gr">' + c.g + '</span></button>').join('');
  box.classList.add('open');
}
function useSuggestion(inputId, boxId, name){
  $(inputId).value = name;
  hideSuggest(boxId);
  if(inputId === 'newItem') quickAdd(); else addBuy();
}
function hideSuggest(boxId){
  const box = $(boxId);
  if(box){ box.classList.remove('open'); box.innerHTML = ''; }
}
/* korjaa käyttäjän kirjoittaman nimen katalogin muotoon */
function tidyName(raw){
  const n = raw.trim().toLowerCase();
  const exact = CATALOG.find(c => c.n.toLowerCase() === n);
  if(exact) return exact.n;
  const near = CATALOG.find(c => c.n.toLowerCase().startsWith(n) || n.startsWith(c.n.toLowerCase()));
  if(near) return near.n;
  return raw.trim().charAt(0).toUpperCase() + raw.trim().slice(1);
}

/* ---------- TALLENNUS ----------
   Tiedot tallennetaan puhelimen omaan muistiin (localStorage),
   jotta ne säilyvät, vaikka sovellus suljetaan. Palvelinta ei tarvita. */
/* ---------- YMPÄRISTÖ ----------
   Sama tiedosto toimii sekä testaajien versiona että kehitysversiona.
   Kehitysversio tunnistetaan osoitteesta (esim. .../resp-kehitys/), tai
   iOS-rakennus kirjoittaa alla olevaan riviin 'kehitys'.
   Kehitysversiolla on omat tallennetut tiedot, eikä se lähetä analytiikkaa. */
const APP_ENV_OVERRIDE = '';
const APP_ENV = APP_ENV_OVERRIDE || (/kehitys/i.test(location.href) ? 'kehitys' : 'tuotanto');
const IS_DEV = APP_ENV === 'kehitys';

const STORE_KEY = IS_DEV ? 'resp-kehitys-tila-v1' : 'resp-tila-v1';

function saveState(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      v: 1,
      stock: stock,
      cart: cart,
      planned: planned,
      savedKg: savedKg,
      savedEur: savedEur,
      userName: userName,
      alerts: alerts.slice(0, 40),
      own: recipes.filter(r => r.own),
      favs: recipes.filter(r => r.fav && !r.own).map(r => r.id)
    }));
  }catch(e){ /* muisti täynnä tai estetty: sovellus toimii silti */ }
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(Array.isArray(d.stock))   stock = d.stock;
    if(Array.isArray(d.cart))    cart = d.cart;
    if(Array.isArray(d.planned)) planned = d.planned;
    if(typeof d.savedKg === 'number')  savedKg = d.savedKg;
    if(typeof d.savedEur === 'number') savedEur = d.savedEur;
    if(typeof d.userName === 'string' && d.userName) userName = d.userName;
    if(Array.isArray(d.alerts))  alerts = d.alerts;
    const favs = new Set(d.favs || []);
    recipes.forEach(r => { r.fav = favs.has(r.id); });
    if(Array.isArray(d.own) && d.own.length) recipes = d.own.concat(recipes.filter(r => !r.own));
    return true;
  }catch(e){ return false; }
}

/* tallennetaan automaattisesti aina, kun jokin näkymä piirretään uudelleen,
   eli jokaisen muutoksen jälkeen */
let saveTimer = null;
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 150);
}
['drawStock','drawCart','drawHome','drawProfile','drawRecipes','drawAlerts'].forEach(function(name){
  const original = window[name];
  if(typeof original !== 'function') return;
  window[name] = function(){
    const result = original.apply(this, arguments);
    queueSave();
    return result;
  };
});
/* varmuuden vuoksi tallennus myös silloin, kun sovellus siirtyy taustalle */
document.addEventListener('visibilitychange', function(){ if(document.hidden) saveState(); });
window.addEventListener('pagehide', saveState);

function askReset(){
  sheet('<div class="grip"></div><h2>Aloitetaanko alusta?</h2>' +
    '<p class="note">Kaikki varaston tuotteet, ostoslista, omat reseptit ja säästötiedot poistetaan, ja sovellus palaa alkutilaan. Tätä ei voi perua.</p>' +
    '<button class="btn red" style="margin-top:18px" onclick="resetAll()">Poista kaikki tiedot</button>' +
    '<button class="btn ghost" onclick="closeSheet()">Peruuta</button>');
}
function resetAll(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  window.removeEventListener('pagehide', saveState);
  location.reload();
}

/* =======================================================
   TESTIKÄYTTÖ JA ANALYTIIKKA
   Täytä nämä kaksi riviä ennen testin alkua:
   ======================================================= */
const ANALYTICS_KEY = 'phc_LIITA_TAHAN_POSTHOG_AVAIN';   // PostHogin Project API Key
const SURVEY_URL    = '';                               // loppukyselyn osoite, esim. Google Forms
const TEST_DAYS     = 14;

const ANALYTICS_HOST = 'https://eu.i.posthog.com';       // EU-palvelin (GDPR)
const TESTER_KEY = IS_DEV ? 'resp-kehitys-testaaja-v1' : 'resp-testaaja-v1';

let tester = null;          // {id, consent, start, surveyShown}
let analyticsOn = false;

function analyticsConfigured(){ return !IS_DEV && /^phc_[A-Za-z0-9]{20,}$/.test(ANALYTICS_KEY); }

function loadTester(){
  try{ tester = JSON.parse(localStorage.getItem(TESTER_KEY) || 'null'); }catch(e){ tester = null; }
}
function saveTester(){
  try{ localStorage.setItem(TESTER_KEY, JSON.stringify(tester)); }catch(e){}
}
function testDay(){
  if(!tester || !tester.start) return 0;
  return Math.floor((Date.now() - tester.start) / 86400000) + 1;
}

/* PostHogin virallinen latauskoodi: ladataan vasta suostumuksen jälkeen */
function startPostHog(){
  if(analyticsOn || !analyticsConfigured()) return;
  !function(t,e){var o,n,p,r;e.__SV||(window.posthog=e,e._i=[],e.init=function(i,s,a){function g(t,e){var o=e.split(".");2==o.length&&(t=t[o[0]],e=o[1]),t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}}(p=t.createElement("script")).type="text/javascript",p.crossOrigin="anonymous",p.async=!0,p.src=s.api_host.replace(".i.posthog.com","-assets.i.posthog.com")+"/static/array.js",(r=t.getElementsByTagName("script")[0]).parentNode.insertBefore(p,r);var u=e;for(void 0!==a?u=e[a]=[]:a="posthog",u.people=u.people||[],u.toString=function(t){var e="posthog";return"posthog"!==a&&(e+="."+a),t||(e+=" (stub)"),e},u.people.toString=function(){return u.toString(1)+".people (stub)"},o="init capture register register_once unregister identify setPersonProperties reset get_distinct_id opt_in_capturing opt_out_capturing has_opted_in_capturing has_opted_out_capturing startSessionRecording stopSessionRecording".split(" "),n=0;n<o.length;n++)g(u,o[n]);e._i.push([i,s,a])},e.__SV=1)}(document,window.posthog||[]);

  window.posthog.init(ANALYTICS_KEY, {
    api_host: ANALYTICS_HOST,
    person_profiles: 'identified_only',
    capture_pageview: false,
    autocapture: true,
    session_recording: { maskAllInputs: true }
  });
  window.posthog.identify(tester.id, { testaaja: tester.id, testi_alkoi: new Date(tester.start).toISOString().slice(0,10) });
  window.posthog.register({ testaaja: tester.id, sovellusversio: 'resp-proto-1' });
  analyticsOn = true;
}

/* yksi kutsu kaikille tapahtumille; ei tee mitään ilman suostumusta */
function track(event, props){
  if(!analyticsOn || !window.posthog) return;
  try{ window.posthog.capture(event, Object.assign({ testipaiva: testDay() }, props || {})); }catch(e){}
}

/* ---------- ensimmäinen avaus: tunnus ja suostumus ---------- */
function openOnboarding(){
  sheet('<div class="grip"></div>' +
    '<h2>Tervetuloa Respin testiin</h2>' +
    '<p class="note">Kiitos, että testaat sovellusta! Testi kestää ' + TEST_DAYS + ' päivää. Käytä Respiä omassa keittiössäsi niin kuin käyttäisit oikeasti.</p>' +
    '<div class="field" style="margin-top:16px"><label for="tId">Testaajatunnus</label>' +
      '<input id="tId" placeholder="esim. T07" autocomplete="off" style="text-transform:uppercase"></div>' +
    '<div class="tip" style="background:var(--green-soft)"><span>🔒</span><span>Keräämme tietoa siitä, mitä toimintoja käytät ja kuinka usein, jotta voimme parantaa sovellusta. ' +
      'Nimeäsi, sähköpostiasi tai kirjoittamiasi tekstejä ei tallenneta. Tiedot säilytetään EU:ssa ja poistetaan testin jälkeen. ' +
      'Voit perua suostumuksen milloin tahansa Profiilin kohdasta Testikäyttö.</span></div>' +
    '<button class="btn" onclick="acceptTest(true)">Hyväksyn ja aloitan testin</button>' +
    '<button class="btn ghost" onclick="acceptTest(false)">Käytän ilman tietojen keruuta</button>');
}
function acceptTest(consent){
  const raw = (($('tId') && $('tId').value) || '').trim().toUpperCase();
  if(consent && !raw){ toast('Kirjoita saamasi testaajatunnus'); return; }
  tester = { id: raw || ('ANON-' + Math.random().toString(36).slice(2,7).toUpperCase()),
             consent: !!consent, start: Date.now(), surveyShown: false };
  saveTester();
  closeSheet();
  if(consent){
    startPostHog();
    track('testi_aloitettu');
    toast('Testi alkoi – kiitos! 🎉');
  } else {
    toast('Voit käyttää sovellusta normaalisti');
  }
  drawTestRow();
}

/* ---------- profiilin testikohta ---------- */
function drawTestRow(){
  const el = $('testRowSub');
  if(!el) return;
  if(!tester){ el.textContent = 'Ei aloitettu'; return; }
  el.textContent = tester.id + ' · päivä ' + Math.min(testDay(), TEST_DAYS) + '/' + TEST_DAYS + (tester.consent ? '' : ' · ei keruuta');
}
function openTestSettings(){
  if(!tester){ openOnboarding(); return; }
  sheet('<div class="grip"></div><h2>Testikäyttö</h2>' +
    '<p class="note">Tunnus <b>' + tester.id + '</b>, testipäivä ' + Math.min(testDay(), TEST_DAYS) + ' / ' + TEST_DAYS + '.</p>' +
    '<div class="tip" style="margin-top:14px;background:' + (tester.consent ? 'var(--green-soft)' : 'var(--amber-soft)') + '"><span>' +
      (tester.consent ? '✅' : '⏸️') + '</span><span>' +
      (tester.consent ? 'Käyttötietojen keruu on päällä.' : 'Käyttötietoja ei kerätä.') + '</span></div>' +
    (tester.consent
      ? '<button class="btn ghost" onclick="setConsent(false)">Lopeta tietojen keruu</button>'
      : '<button class="btn" onclick="setConsent(true)">Salli tietojen keruu</button>') +
    (SURVEY_URL ? '<button class="btn amber" onclick="openSurvey()">Vastaa loppukyselyyn</button>' : '') +
    '<button class="btn ghost" onclick="closeSheet()">Sulje</button>');
}
function setConsent(on){
  tester.consent = on; saveTester();
  if(on){ startPostHog(); if(window.posthog) window.posthog.opt_in_capturing(); track('suostumus_annettu'); }
  else { track('suostumus_peruttu'); if(window.posthog) window.posthog.opt_out_capturing(); analyticsOn = false; }
  closeSheet(); drawTestRow();
  toast(on ? 'Tietojen keruu päällä' : 'Tietojen keruu lopetettu');
}

/* ---------- loppukysely testin lopussa ---------- */
function maybeAskSurvey(){
  if(!tester || tester.surveyShown || !SURVEY_URL) return;
  if(testDay() < TEST_DAYS - 1) return;
  tester.surveyShown = true; saveTester();
  sheet('<div class="grip"></div><h2>Testi on lopuillaan</h2>' +
    '<p class="note">Kiitos, että olet käyttänyt Respiä! Vastaisitko vielä lyhyeen loppukyselyyn? Se vie noin viisi minuuttia ja auttaa meitä eniten.</p>' +
    '<button class="btn amber" style="margin-top:16px" onclick="openSurvey()">Avaa kysely</button>' +
    '<button class="btn ghost" onclick="closeSheet()">Myöhemmin</button>');
}
function openSurvey(){
  track('loppukysely_avattu');
  const sep = SURVEY_URL.includes('?') ? '&' : '?';
  window.open(SURVEY_URL + sep + 'tunnus=' + encodeURIComponent(tester ? tester.id : ''), '_blank');
}

/* ---------- tapahtumat sovelluksen ydinpolulta ----------
   Kääritään olemassa olevat toiminnot: logiikka pysyy ennallaan. */
function instrument(name, before){
  const original = window[name];
  if(typeof original !== 'function') return;
  window[name] = function(){
    try{ before.apply(this, arguments); }catch(e){}
    return original.apply(this, arguments);
  };
}
function currentPage(){
  const on = document.querySelector('.page.on');
  return on && on.id ? on.id.replace('p-','') : '';
}
function setupTracking(){
  /* sama näkymä piirretään joskus uudelleen sisäisesti: kirjataan vain todelliset siirtymät */
  instrument('go', p => { if(currentPage() !== p) track('nakyma', { sivu: p }); });
  instrument('quickAdd', () => {
    const v = ($('newItem') && $('newItem').value || '').trim();
    if(v) track('tuote_lisatty', { tapa: 'kasin', ryhma: guessGroup(v) });
  });
  instrument('addBuy', () => {
    const v = ($('newBuy') && $('newBuy').value || '').trim();
    if(v) track('ostoslistalle_lisatty', { tapa: 'kasin' });
  });
  instrument('openScan', () => track('kuittiskannaus_avattu'));
  instrument('saveScan', () => {
    const keep = (scanItems || []).filter(i => i.keep).length;
    track('kuitti_tallennettu', { riveja: (scanItems || []).length, valittuja: keep, kauppa: scanShop });
  });
  instrument('openRecipe', id => {
    if(currentPage() === 'resepti') return;
    const r = recipes.find(x => x.id === id); if(!r) return;
    const st = recipeState(r);
    track('resepti_avattu', { resepti: r.name, kategoria: r.cat, kotona: st.have.length, puuttuu: st.miss.length, oma: !!r.own });
  });
  instrument('missingToCart', id => {
    const r = recipes.find(x => x.id === id); if(!r) return;
    track('puuttuvat_ostoslistalle', { resepti: r.name, maara: recipeState(r).miss.length });
  });
  instrument('cookRecipe', id => {
    const r = recipes.find(x => x.id === id); if(!r) return;
    track('ruoka_tehty', { resepti: r.name, kategoria: r.cat, pelasti_vanhenevia: rescues(r) });
  });
  instrument('useItem', id => {
    const i = stock.find(x => x.id === id); if(!i) return;
    track('tuote_kaytetty', { ryhma: i.group, paivia_jaljella: i.days });
  });
  instrument('tossItem', id => {
    const i = stock.find(x => x.id === id); if(!i) return;
    track('tuote_heitetty', { ryhma: i.group, paivia_jaljella: i.days });
  });
  instrument('cartToStock', () => track('ostokset_varastoon', { maara: cart.filter(c => c.done).length }));
  instrument('homeSearch', () => track('haku', { hakusana: ($('homeQ').value || '').trim().toLowerCase().slice(0, 40) }));
  instrument('pickMeal', m => track('kategoria_valittu', { kategoria: m }));
  instrument('unplan', () => track('suunnitelma_poistettu'));
  instrument('showExpiring', () => track('vanhenevat_avattu'));
  instrument('openRecipeEditor', () => track('oma_resepti_aloitettu'));
  instrument('saveDraft', () => track('oma_resepti_tallennettu'));
}

function startTesting(){
  loadTester();
  setupTracking();
  if(tester && tester.consent) startPostHog();
  drawTestRow();
  if(!tester){ setTimeout(openOnboarding, 400); return; }
  track('sovellus_avattu', { varastossa: stock.length });
  setTimeout(maybeAskSurvey, 800);
}

function markDevVersion(){
  if(!IS_DEV) return;
  document.title = 'Resp DEV';
  const tag = document.createElement('div');
  tag.className = 'dev-tag';
  tag.textContent = 'Kehitysversio';
  tag.setAttribute('aria-label', 'Kehitysversio, testaajat eivät näe näitä muutoksia');
  document.body.appendChild(tag);
}

function start(){
  markDevVersion();
  const logo = $('brandLogo');
  if(PHOTOS.__logo) logo.src = PHOTOS.__logo;
  loadState();
  drawStock(); drawRecipes(); drawCart(); drawProfile(); drawHome(); drawAlerts();
  startTesting();
}
start();
</script>
